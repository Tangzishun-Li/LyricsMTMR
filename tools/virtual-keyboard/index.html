<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LyricsMTMR — 键位编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0d0b12;
  --surface: #121017;
  --card: #25202e;
  --card-hover: #2e2839;
  --inset: rgba(0,0,0,0.26);
  --accent: #ff8f57;
  --accent-deep: #f25c42;
  --mint: #5cd9a1;
  --text-primary: #f5f2ed;
  --text-secondary: #a8a1b8;
  --text-tertiary: #736b85;
  --hairline: rgba(255,255,255,0.07);
  --hairline-strong: rgba(255,255,255,0.14);
  --hover-fill: rgba(255,255,255,0.06);
  --selected-fill: rgba(255,143,87,0.12);
  --key-radius: 6px;
  --key-gap: 4px;
  --key-height: 48px;
  --key-unit: 52px;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 24px;
  -webkit-font-smoothing: antialiased;
}

.header { text-align: center; margin-bottom: 32px; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0; margin-bottom: 6px; }
.header p { font-size: 13px; color: var(--text-secondary); font-weight: 450; }

.legend { display: flex; gap: 20px; margin-bottom: 24px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-secondary); font-weight: 500; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--hairline-strong); }
.legend-swatch.bound { background: var(--selected-fill); border-color: var(--accent); box-shadow: 0 0 6px rgba(255,143,87,0.25); }
.legend-swatch.active { background: var(--mint); border-color: var(--mint); }
.legend-swatch.modifier { background: var(--card); border-color: var(--hairline-strong); }

.keyboard-frame {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 24px 28px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 var(--hairline);
}

.keyboard { display: flex; flex-direction: column; gap: var(--key-gap); }
.kb-row { display: flex; gap: var(--key-gap); justify-content: flex-start; }

.key {
  position: relative;
  height: var(--key-height);
  min-width: var(--key-unit);
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--card);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--key-radius);
  cursor: pointer;
  transition: all 0.1s ease;
  user-select: none;
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
}
.key:hover {
  background: var(--card-hover);
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
}
.key:active, .key.pressed {
  transform: translateY(1px);
  background: var(--inset);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}

.key .label { font-size: 13px; font-weight: 550; color: var(--text-primary); line-height: 1.1; }
.key .sublabel { font-size: 9px; color: var(--text-tertiary); margin-top: 1px; font-weight: 450; }
.key .keycode-tag {
  position: absolute; top: 3px; right: 4px; font-size: 8px;
  color: var(--text-tertiary); opacity: 0; transition: opacity 0.15s;
  font-family: "SF Mono", "Fira Code", monospace;
}
.key:hover .keycode-tag { opacity: 1; }

.key.modifier { background: #1c1825; border-color: var(--hairline); }
.key.modifier .label { font-size: 11px; color: var(--text-secondary); }
.key.modifier.active { background: rgba(92,217,161,0.15); border-color: var(--mint); box-shadow: 0 0 10px rgba(92,217,161,0.2); }
.key.modifier.active .label { color: var(--mint); }

.key.bound { background: var(--selected-fill); border-color: var(--accent); box-shadow: 0 0 8px rgba(255,143,87,0.15), inset 0 1px 0 rgba(255,143,87,0.1); }
.key.bound .label { color: var(--accent); }
.key.bound::after {
  content: attr(data-binding);
  position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  font-size: 8px; color: var(--accent); opacity: 0.8; white-space: nowrap; font-weight: 600;
}
.key.bound:hover::after { opacity: 1; }

.key.w125 { min-width: calc(var(--key-unit) * 1.25); }
.key.w150 { min-width: calc(var(--key-unit) * 1.5); }
.key.w175 { min-width: calc(var(--key-unit) * 1.75); }
.key.w225 { min-width: calc(var(--key-unit) * 2.25); }
.key.w625 { min-width: calc(var(--key-unit) * 6.25); }

.kb-row.fn-row .key { height: 36px; }
.kb-row.fn-row .key .label { font-size: 11px; }
.kb-row.fn-row .key .sublabel { font-size: 8px; }

.arrow-stack { display: flex; flex-direction: column; gap: 4px; }
.arrow-stack .key { height: calc(var(--key-height) / 2 - 2px); min-width: var(--key-unit); }

.tooltip {
  position: fixed; background: #1e1a28; border: 1px solid var(--hairline-strong);
  border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--text-primary);
  pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 1000;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 260px;
}
.tooltip.visible { opacity: 1; }
.tooltip .tt-title { font-weight: 650; margin-bottom: 4px; }
.tooltip .tt-code { font-family: "SF Mono", monospace; font-size: 11px; color: var(--mint); }
.tooltip .tt-binding { margin-top: 4px; font-size: 11px; color: var(--accent); }

.status-bar { margin-top: 24px; display: flex; gap: 24px; align-items: center; font-size: 12px; color: var(--text-tertiary); }
.status-bar .stat { display: flex; align-items: center; gap: 6px; }
.status-bar .stat-value { color: var(--text-secondary); font-weight: 600; font-family: "SF Mono", monospace; }
.status-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }

.detail-panel {
  margin-top: 24px; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 20px 24px; width: 100%; max-width: 900px; display: none;
}
.detail-panel.visible { display: block; }
.detail-panel h3 { font-size: 14px; font-weight: 650; margin-bottom: 12px; }
.detail-panel .binding-info { display: grid; grid-template-columns: 100px 1fr; gap: 8px 16px; font-size: 12px; }
.detail-panel .binding-info dt { color: var(--text-tertiary); font-weight: 500; }
.detail-panel .binding-info dd { color: var(--text-secondary); font-family: "SF Mono", monospace; font-size: 11px; }
</style>
</head>
<body>

<div class="header">
  <h1>键位编辑器</h1>
  <p>LyricsMTMR Virtual Keyboard — 点击键位查看绑定 · 修饰键实时跟随物理键盘</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch bound"></div><span>已绑定快捷键</span></div>
  <div class="legend-item"><div class="legend-swatch active"></div><span>修饰键按下</span></div>
  <div class="legend-item"><div class="legend-swatch modifier"></div><span>修饰键</span></div>
</div>

<div class="keyboard-frame">
  <div class="keyboard" id="keyboard"></div>
</div>

<div class="status-bar">
  <div class="stat"><div class="dot"></div><span>已绑定</span><span class="stat-value" id="bound-count">5</span></div>
  <div class="stat"><span>总键位</span><span class="stat-value" id="total-keys">0</span></div>
  <div class="stat"><span>当前组合</span><span class="stat-value" id="current-combo">—</span></div>
</div>

<div class="detail-panel" id="detail-panel">
  <h3 id="detail-title">绑定详情</h3>
  <dl class="binding-info" id="detail-content"></dl>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
var KEY_MAP = {
  53:{label:'esc',sub:''},
  122:{label:'F1',sub:'\u{1F505}'},120:{label:'F2',sub:'\u{1F506}'},
  99:{label:'F3',sub:'\u2303\u2318'},118:{label:'F4',sub:'\u{1F50D}'},
  96:{label:'F5',sub:'\u{1F3A4}'},97:{label:'F6',sub:'\u{1F319}'},
  98:{label:'F7',sub:'\u23EE'},100:{label:'F8',sub:'\u23EF'},101:{label:'F9',sub:'\u23ED'},
  109:{label:'F10',sub:'\u{1F507}'},103:{label:'F11',sub:'\u{1F509}'},111:{label:'F12',sub:'\u{1F50A}'},
  50:{label:'`',sub:'~'},18:{label:'1',sub:'!'},19:{label:'2',sub:'@'},
  20:{label:'3',sub:'#'},21:{label:'4',sub:'$'},23:{label:'5',sub:'%'},
  22:{label:'6',sub:'^'},26:{label:'7',sub:'&'},28:{label:'8',sub:'*'},
  25:{label:'9',sub:'('},29:{label:'0',sub:')'},27:{label:'-',sub:'_'},
  24:{label:'=',sub:'+'},51:{label:'\u232B',sub:'delete'},
  48:{label:'\u21E5',sub:'tab'},
  12:{label:'Q',sub:''},13:{label:'W',sub:''},14:{label:'E',sub:''},
  15:{label:'R',sub:''},17:{label:'T',sub:''},16:{label:'Y',sub:''},
  32:{label:'U',sub:''},34:{label:'I',sub:''},31:{label:'O',sub:''},
  35:{label:'P',sub:''},33:{label:'[',sub:'{'},30:{label:']',sub:'}'},42:{label:'\\',sub:'|'},
  57:{label:'\u21EA',sub:'caps'},
  0:{label:'A',sub:''},1:{label:'S',sub:''},2:{label:'D',sub:''},
  3:{label:'F',sub:''},5:{label:'G',sub:''},4:{label:'H',sub:''},
  38:{label:'J',sub:''},40:{label:'K',sub:''},37:{label:'L',sub:''},
  41:{label:';',sub:':'},39:{label:"'",sub:'"'},36:{label:'\u23CE',sub:'return'},
  56:{label:'\u21E7',sub:'shift'},
  6:{label:'Z',sub:''},7:{label:'X',sub:''},8:{label:'C',sub:''},
  9:{label:'V',sub:''},11:{label:'B',sub:''},45:{label:'N',sub:''},
  46:{label:'M',sub:''},43:{label:',',sub:'<'},47:{label:'.',sub:'>'},
  44:{label:'/',sub:'?'},60:{label:'\u21E7',sub:'shift'},
  63:{label:'fn',sub:''},59:{label:'\u2303',sub:'ctrl'},
  58:{label:'\u2325',sub:'option'},55:{label:'\u2318',sub:'cmd'},
  49:{label:'',sub:'space'},54:{label:'\u2318',sub:'cmd'},61:{label:'\u2325',sub:'option'},
  123:{label:'\u2190',sub:''},126:{label:'\u2191',sub:''},
  125:{label:'\u2193',sub:''},124:{label:'\u2192',sub:''}
};

var LAYOUT = [
  {row:'fn', keys:[
    {code:53,w:''},{code:122,w:''},{code:120,w:''},{code:99,w:''},
    {code:118,w:''},{code:96,w:''},{code:97,w:''},{code:98,w:''},
    {code:100,w:''},{code:101,w:''},{code:109,w:''},{code:103,w:''},{code:111,w:''}
  ]},
  {row:'num', keys:[
    {code:50,w:''},{code:18,w:''},{code:19,w:''},{code:20,w:''},
    {code:21,w:''},{code:23,w:''},{code:22,w:''},{code:26,w:''},
    {code:28,w:''},{code:25,w:''},{code:29,w:''},{code:27,w:''},
    {code:24,w:''},{code:51,w:'w150'}
  ]},
  {row:'qwerty', keys:[
    {code:48,w:'w150'},{code:12,w:''},{code:13,w:''},{code:14,w:''},
    {code:15,w:''},{code:17,w:''},{code:16,w:''},{code:32,w:''},
    {code:34,w:''},{code:31,w:''},{code:35,w:''},{code:33,w:''},
    {code:30,w:''},{code:42,w:'w150'}
  ]},
  {row:'home', keys:[
    {code:57,w:'w175'},{code:0,w:''},{code:1,w:''},{code:2,w:''},
    {code:3,w:''},{code:5,w:''},{code:4,w:''},{code:38,w:''},
    {code:40,w:''},{code:37,w:''},{code:41,w:''},{code:39,w:''},
    {code:36,w:'w175'}
  ]},
  {row:'shift', keys:[
    {code:56,w:'w225'},{code:6,w:''},{code:7,w:''},{code:8,w:''},
    {code:9,w:''},{code:11,w:''},{code:45,w:''},{code:46,w:''},
    {code:43,w:''},{code:47,w:''},{code:44,w:''},{code:60,w:'w225'}
  ]},
  {row:'bottom', keys:[
    {code:63,w:''},{code:59,w:'w125'},{code:58,w:'w125'},{code:55,w:'w150'},
    {code:49,w:'w625'},
    {code:54,w:'w150'},{code:61,w:'w125'},
    {code:123,w:''},{code:'arrows',w:''},{code:124,w:''}
  ]}
];

var BINDINGS = {
  123:{combo:'\u2303\u2190', title:'\u5DE6\u5207\u6807\u7B7E\u9875', script:'key code 123 using {control down}'},
  124:{combo:'\u2303\u2192', title:'\u53F3\u5207\u6807\u7B7E\u9875', script:'key code 124 using {control down}'},
  23:{combo:'\u2318\u21E75', title:'\u5168\u5C4F\u622A\u56FE', script:'key code 23 using {command down, shift down}'},
  24:{combo:'\u2318\u21E74', title:'\u533A\u57DF\u622A\u56FE', script:'key code 24 using {command down, shift down}'},
  25:{combo:'\u2318\u21E73', title:'\u7A97\u53E3\u622A\u56FE', script:'key code 25 using {command down, shift down}'}
};

var MODIFIERS = [55,54,56,60,58,61,59,63];

var kbEl = document.getElementById('keyboard');
var tooltip = document.getElementById('tooltip');
var detailPanel = document.getElementById('detail-panel');
var totalKeys = 0;

function isModifier(code) { return MODIFIERS.indexOf(code) !== -1; }

function makeKey(code, info, widthClass) {
  var keyEl = document.createElement('div');
  keyEl.className = 'key' + (widthClass ? ' ' + widthClass : '');
  keyEl.setAttribute('data-code', code);
  if (isModifier(code)) keyEl.classList.add('modifier');
  if (BINDINGS[code]) {
    keyEl.classList.add('bound');
    keyEl.setAttribute('data-binding', BINDINGS[code].combo);
  }
  keyEl.innerHTML =
    '<span class="keycode-tag">' + code + '</span>' +
    '<span class="label">' + info.label + '</span>' +
    (info.sub ? '<span class="sublabel">' + info.sub + '</span>' : '');

  keyEl.addEventListener('mouseenter', function(e) {
    var binding = BINDINGS[code];
    tooltip.innerHTML =
      '<div class="tt-title">' + (info.label || info.sub) + ' <span style="color:var(--text-tertiary)">keyCode ' + code + '</span></div>' +
      '<div class="tt-code">key code ' + code + '</div>' +
      (binding ? '<div class="tt-binding">' + binding.combo + ' \u2192 ' + binding.title + '</div>' : '');
    tooltip.classList.add('visible');
    positionTooltip(e);
  });
  keyEl.addEventListener('mousemove', positionTooltip);
  keyEl.addEventListener('mouseleave', function() { tooltip.classList.remove('visible'); });

  keyEl.addEventListener('click', function() {
    var binding = BINDINGS[code];
    if (binding) {
      document.getElementById('detail-title').textContent = binding.combo + ' \u2014 ' + binding.title;
      document.getElementById('detail-content').innerHTML =
        '<dt>KeyCode</dt><dd>' + code + '</dd>' +
        '<dt>\u7EC4\u5408\u952E</dt><dd>' + binding.combo + '</dd>' +
        '<dt>AppleScript</dt><dd>tell application "System Events" to ' + binding.script + '</dd>' +
        '<dt>\u7ED1\u5B9A Item</dt><dd>' + binding.title + '</dd>';
    } else {
      document.getElementById('detail-title').textContent = (info.label || info.sub) + ' \u2014 \u672A\u7ED1\u5B9A';
      document.getElementById('detail-content').innerHTML =
        '<dt>KeyCode</dt><dd>' + code + '</dd>' +
        '<dt>\u72B6\u6001</dt><dd style="color:var(--text-tertiary)">\u65E0\u7ED1\u5B9A</dd>' +
        '<dt>\u53EF\u751F\u6210</dt><dd>tell application "System Events" to key code ' + code + ' using {\u2026}</dd>';
    }
    detailPanel.classList.add('visible');
  });
  return keyEl;
}

LAYOUT.forEach(function(rowDef) {
  var rowEl = document.createElement('div');
  rowEl.className = 'kb-row' + (rowDef.row === 'fn' ? ' fn-row' : '');

  rowDef.keys.forEach(function(k) {
    if (k.code === 'arrows') {
      var stack = document.createElement('div');
      stack.className = 'arrow-stack';
      [126,125].forEach(function(code) {
        totalKeys++;
        stack.appendChild(makeKey(code, KEY_MAP[code], ''));
      });
      rowEl.appendChild(stack);
      return;
    }
    var info = KEY_MAP[k.code];
    if (!info) return;
    totalKeys++;
    rowEl.appendChild(makeKey(k.code, info, k.w));
  });

  kbEl.appendChild(rowEl);
});

document.getElementById('total-keys').textContent = totalKeys;

function positionTooltip(e) {
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
}

// Physical keyboard modifier tracking
var activeMods = {};

function updateComboDisplay() {
  var parts = [];
  if (activeMods['Control']) parts.push('\u2303');
  if (activeMods['Option']) parts.push('\u2325');
  if (activeMods['Shift']) parts.push('\u21E7');
  if (activeMods['Meta']) parts.push('\u2318');
  document.getElementById('current-combo').textContent = parts.length ? parts.join('') : '\u2014';
}

function syncModifierUI() {
  var els = document.querySelectorAll('.key.modifier');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var code = parseInt(el.getAttribute('data-code'));
    var isActive = false;
    if ((code === 55 || code === 54) && activeMods['Meta']) isActive = true;
    if ((code === 56 || code === 60) && activeMods['Shift']) isActive = true;
    if ((code === 58 || code === 61) && activeMods['Option']) isActive = true;
    if (code === 59 && activeMods['Control']) isActive = true;
    if (isActive) { el.classList.add('active'); } else { el.classList.remove('active'); }
  }
  updateComboDisplay();
}

document.addEventListener('keydown', function(e) {
  var k = e.key;
  if (k === 'Meta' || k === 'Shift' || k === 'Alt' || k === 'Control') {
    activeMods[k === 'Alt' ? 'Option' : k] = true;
    syncModifierUI();
  }
  var el = document.querySelector('.key[data-code="' + e.keyCode + '"]');
  if (el) el.classList.add('pressed');
});

document.addEventListener('keyup', function(e) {
  var k = e.key;
  if (k === 'Meta' || k === 'Shift' || k === 'Alt' || k === 'Control') {
    delete activeMods[k === 'Alt' ? 'Option' : k];
    syncModifierUI();
  }
  var el = document.querySelector('.key[data-code="' + e.keyCode + '"]');
  if (el) el.classList.remove('pressed');
});

kbEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });
</script>
</body>
</html>
