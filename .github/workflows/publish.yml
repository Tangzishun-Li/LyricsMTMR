# 仅版本标签触发：推送 v* 标签（如 v0.9）才构建 universal Release 包并上传到 GitHub Release。
# 日常 push / PR 由 build-test.yml 负责（只测试+Debug 构建，不上传），不会误触发发布。
name: Build universal release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Archive (universal binary)
        run: |
          cd LyricsMTMR
          xcodebuild archive \
            -project LyricsMTMR.xcodeproj \
            -scheme MTMR \
            -archivePath Release/LyricsMTMR.xcarchive \
            DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            | xcpretty -c && exit ${PIPESTATUS[0]}

      - name: Verify universal binary
        run: lipo -info LyricsMTMR/Release/LyricsMTMR.xcarchive/Products/Applications/LyricsMTMR.app/Contents/MacOS/LyricsMTMR

      - name: Package app (zip + sha256)
        run: |
          APP="LyricsMTMR/Release/LyricsMTMR.xcarchive/Products/Applications/LyricsMTMR.app"
          test -d "$APP" || { echo "APP not found at $APP"; exit 1; }
          ZIP="LyricsMTMR-${GITHUB_REF_NAME}-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"

      - name: Download Sparkle signing tools (2.1.0)
        run: |
          curl -fsSL -o /tmp/Sparkle-2.1.0.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.1.0/Sparkle-2.1.0.tar.xz"
          mkdir -p /tmp/sparkle210 && tar -xJf /tmp/Sparkle-2.1.0.tar.xz -C /tmp/sparkle210
          test -x /tmp/sparkle210/bin/sign_update

      - name: Generate appcast.xml (Sparkle feed, EdDSA-signed)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          APP="LyricsMTMR/Release/LyricsMTMR.xcarchive/Products/Applications/LyricsMTMR.app"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          TAG="${GITHUB_REF_NAME}"
          ZIP="LyricsMTMR-${TAG}-universal.zip"
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "ERROR: SPARKLE_PRIVATE_KEY secret is not set"; exit 1; }
          # 私钥文件：base64(96B) = expanded 私钥(64B) + 公钥(32B)，与 generate_keys -x 导出格式一致
          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          SIG_OUT=$(/tmp/sparkle210/bin/sign_update -f "$KEYFILE" "$ZIP")
          EDSIG=$(printf '%s' "$SIG_OUT" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')
          LENGTH=$(printf '%s' "$SIG_OUT" | sed -E 's/.*length="([0-9]+)".*/\1/')
          test -n "$EDSIG" || { echo "ERROR: failed to parse edSignature from: $SIG_OUT"; exit 1; }
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>LyricsMTMR</title>
              <item>
                <title>${SHORT} (${BUILD})</title>
                <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${SHORT}</sparkle:shortVersionString>
                <enclosure url="https://github.com/Tangzishun-Li/LyricsMTMR/releases/download/${TAG}/${ZIP}" type="application/octet-stream" sparkle:edSignature="${EDSIG}" length="${LENGTH}"/>
              </item>
            </channel>
          </rss>
          EOF
          echo "--- appcast.xml ---"
          cat appcast.xml
          # 自检：用私钥文件（含公钥）验证签名，确认与 SUPublicEDKey 配套
          /tmp/sparkle210/bin/sign_update --verify -f "$KEYFILE" "$ZIP" "$EDSIG" \
            && echo "--- appcast signature verified OK ---"
          # 交叉自检：Info.plist 的 SUPublicEDKey(base64 公钥) 必须与签名私钥同源，防密钥轮换不同步
          KEY_PUB64=$(base64 -d < "$KEYFILE" | tail -c 32 | base64)
          PLIST_PUB64=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP/Contents/Info.plist" 2>/dev/null)
          if [ -z "$PLIST_PUB64" ] || [ "$KEY_PUB64" != "$PLIST_PUB64" ]; then
            echo "ERROR: SUPublicEDKey(${PLIST_PUB64:-<missing>}) in Info.plist != public key in SPARKLE_PRIVATE_KEY($KEY_PUB64); key rotation out of sync" >&2
            exit 1
          fi
          echo "--- SUPublicEDKey matches SPARKLE_PRIVATE_KEY ---"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LyricsMTMR-v*-universal.zip
            LyricsMTMR-v*-universal.zip.sha256
            appcast.xml
          generate_release_notes: true
