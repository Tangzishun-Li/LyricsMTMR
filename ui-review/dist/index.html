<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LyricsMTMR 设置审阅</title>
  <style>
    :root { --top:#201b28; --bottom:#100e15; --side:#0c0a11; --card:#25202e; --inset:#15121d; --text:#f5f2ed; --secondary:#aaa1b8; --muted:#756d85; --line:rgba(255,255,255,.08); --accent:#ff8f57; --accent-deep:#f25c42; --mint:#5cda9f; }
    * { box-sizing:border-box } body { margin:0; min-width:960px; min-height:100vh; color:var(--text); font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display",sans-serif; background:radial-gradient(700px 480px at 90% -8%,rgba(255,143,87,.15),transparent 60%),radial-gradient(600px 430px at -8% 108%,rgba(92,218,159,.09),transparent 60%),linear-gradient(160deg,var(--top),var(--bottom)); }
    .window { display:flex; min-height:100vh; } .sidebar { width:220px; flex:0 0 220px; padding:38px 10px 14px; border-right:1px solid var(--line); background:rgba(12,10,17,.88); } .brand { padding:0 6px 13px; display:flex; gap:10px; align-items:center; } .appicon { display:grid; place-items:center; width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent-deep),var(--accent));font-size:16px;box-shadow:0 5px 14px rgba(242,92,66,.28) } .brand strong{font-size:13px}.brand small { display:block;color:var(--muted);font-size:10px;margin-top:2px }
    .search { height:31px; display:flex;align-items:center;gap:7px;padding:0 10px;margin:0 2px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.24);color:var(--muted) }.search input{background:transparent;border:0;outline:0;color:var(--text);width:100%;font:inherit}.search input::placeholder{color:var(--muted)}
    .nav { overflow:auto; height:calc(100vh - 165px); padding-right:2px }.group { margin:10px 0 4px;padding:0 8px;color:var(--muted);font-size:10px;letter-spacing:1.05px;font-weight:700 }.nav button { appearance:none;border:0;color:var(--secondary);width:100%;height:31px;padding:0 9px;border-radius:8px;background:transparent;text-align:left;font:inherit;cursor:pointer;display:flex;align-items:center;gap:9px;transition:.15s }.nav button:hover{background:rgba(255,255,255,.055);color:var(--text)}.nav button.active{color:#fff;background:linear-gradient(100deg,rgba(242,92,66,.87),rgba(255,143,87,.9));box-shadow:0 4px 11px rgba(242,92,66,.18)}.nav .icon{width:15px;text-align:center;color:inherit;font-size:14px}.footer {position:fixed;bottom:12px;width:198px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;padding:8px}
    main { flex:1; min-width:0; padding:45px 30px 28px; overflow:auto}.topbar{position:fixed;top:0;left:220px;right:0;height:28px;display:flex;align-items:center;padding-left:70px;color:var(--secondary);font-size:14px}.traffic{position:fixed;top:10px;left:19px;display:flex;gap:7px}.traffic i{width:12px;height:12px;border-radius:50%;background:#ff615a}.traffic i:nth-child(2){background:#ffc144}.traffic i:nth-child(3){background:#32c856}.shell-button{border:0;background:transparent;color:var(--secondary);font-size:17px;cursor:pointer}
    .content { max-width:660px;margin:auto }.heading{margin-bottom:21px}.heading h1{margin:0 0 5px;font-size:25px;letter-spacing:-.4px}.heading p{margin:0;color:var(--secondary);font-size:12.5px}.section{margin:0 0 20px}.label{margin:0 0 8px;color:var(--muted);font-size:11px;letter-spacing:1.1px;font-weight:700}.hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;margin-left:4px}.card{border:1px solid rgba(255,255,255,.09);border-radius:14px;background:linear-gradient(145deg,rgba(43,37,53,.97),rgba(31,27,40,.97));box-shadow:0 6px 14px rgba(0,0,0,.22);overflow:hidden}.row{display:flex;align-items:center;gap:14px;padding:15px 16px;min-height:63px}.row-copy{flex:1}.row-title{font-weight:600;font-size:13.5px}.row-sub{color:var(--secondary);font-size:11.5px;margin-top:4px;line-height:1.25}.divider{height:1px;background:var(--line);margin:0 16px}.toggle{width:42px;height:25px;border-radius:20px;border:1px solid rgba(255,255,255,.16);padding:3px;background:rgba(255,255,255,.1);cursor:pointer;transition:.2s}.toggle:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:white;box-shadow:0 2px 3px rgba(0,0,0,.35);transition:.2s}.toggle.on{background:linear-gradient(var(--accent),var(--accent-deep));box-shadow:0 2px 8px rgba(255,143,87,.28)}.toggle.on:after{transform:translateX(17px)}
    .setting{padding:16px}.split{display:flex;align-items:center;justify-content:space-between;gap:14px}.setting-title{font-size:13.5px;font-weight:600}.segments{display:flex;background:var(--inset);padding:3px;border-radius:9px;gap:2px}.segments button{color:var(--secondary);background:transparent;border:0;border-radius:6px;padding:6px 11px;font:12px inherit;cursor:pointer}.segments button.selected{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:white;box-shadow:0 2px 5px rgba(0,0,0,.25)}.notice{margin:9px 0 0;color:var(--muted);font-size:11.5px}.empty{padding:24px 16px;color:var(--secondary);text-align:center}.empty b{display:block;color:var(--text);font-size:13px;margin-bottom:5px}.placeholder .card{padding:18px}.placeholder p{color:var(--secondary);margin:6px 0 0;line-height:1.55}.review{position:fixed;right:18px;bottom:18px;z-index:4;padding:10px 12px;border:1px solid rgba(92,218,159,.35);border-radius:10px;background:rgba(14,17,20,.88);box-shadow:0 8px 26px rgba(0,0,0,.3);font-size:11px;color:#d1efe0}.review b{color:var(--mint)}
    @media(max-width:760px){body{min-width:0}.sidebar{width:174px;flex-basis:174px}.topbar{left:174px}main{padding:44px 17px 25px}.footer{width:152px}.nav button{font-size:12px}.brand strong{font-size:12px}}
    /* Editor mirror — maps to RibbonEditorView / PaletteRibbon / TouchBarSimulatorView / PropertyInspector */
    .content:has(.editor-view){max-width:none;height:calc(100vh - 73px);margin:0}.editor-view{height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#100e15;box-shadow:0 14px 35px rgba(0,0,0,.28)}.editor-ribbon{display:flex;align-items:stretch;height:76px;background:#0c0a11;overflow:hidden}.r-group{position:relative;display:flex;align-items:center;gap:9px;padding:8px 14px 17px;border-right:1px solid var(--line)}.r-group:after{content:attr(data-label);position:absolute;bottom:4px;left:0;right:0;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.7px}.theme-dot{font-size:18px;color:var(--accent)}.selectlike{min-width:118px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card);color:var(--text);font-size:11px}.tiny{font-size:10px;color:var(--secondary)}.r-action{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:32px;border:0;background:transparent;color:var(--secondary);font-size:9px;cursor:pointer}.r-action:hover{color:var(--accent)}.r-action b{font-size:17px;font-weight:500}.r-action kbd{font:8px -apple-system;color:var(--muted)}.editor-palette{background:#0c0a11;padding:7px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.palette-search{height:25px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.palette-search input{flex:1;height:21px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 8px;color:var(--text);font:11px inherit;outline:none}.chips{display:none;margin-top:7px;gap:5px;flex-wrap:wrap}.chips.show{display:flex}.chip{width:55px;height:40px;padding:4px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--secondary);font-size:9px;cursor:pointer}.chip:hover,.chip.selected{background:rgba(255,143,87,.12);border-color:rgba(255,143,87,.38);color:var(--accent)}.chip b{display:block;font-size:14px;margin-bottom:2px}.simulator{height:130px;padding:22px 28px;background:#090710;position:relative}.sim-label{position:absolute;top:9px;left:14px;color:var(--muted);font-size:10px}.touchbar{height:45px;background:#000;border:5px solid #020202;border-radius:10px;box-shadow:0 5px 11px rgba(0,0,0,.7);display:flex;align-items:stretch;padding:3px}.zone{display:flex;align-items:center;gap:5px;padding:0 8px;border-radius:4px;min-width:16%;background:#111}.zone.center{flex:1;justify-content:center;background:#171717}.handle{width:4px;margin:4px 3px;border-radius:3px;background:#4a4650}.bar-pill{height:25px;display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;background:#29262e;color:#eee;font-size:10px;white-space:nowrap}.bar-pill.selected{outline:1px solid var(--accent);background:rgba(255,143,87,.21)}.bar-pill.mini{width:26px;justify-content:center;padding:0}.inspector{min-height:0;flex:1;display:grid;grid-template-columns:minmax(280px,1fr) 315px;gap:14px;padding:14px;background:linear-gradient(150deg,#15111c,#0e0c14)}.empty-inspector{display:grid;place-content:center;text-align:center;color:var(--secondary)}.empty-inspector .hand{font-size:29px;color:var(--muted);margin-bottom:9px}.empty-inspector p{margin:0 0 7px;font-weight:600}.empty-inspector small{color:var(--muted);font-size:11px}.properties{overflow:auto;border-left:1px solid var(--line);padding-left:18px}.prop-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin:4px 0 15px}.prop-title span{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,143,87,.14);color:var(--accent)}.prop-section{margin-bottom:16px}.prop-section h3{margin:0 0 8px;color:var(--muted);font-size:10px;letter-spacing:1px}.prop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:33px;border-bottom:1px solid var(--line);color:var(--secondary);font-size:11px}.field{width:122px;border:1px solid var(--line);border-radius:5px;background:var(--card);padding:5px 7px;color:var(--text);font:11px inherit}.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#fd9171,#ec5374)}.editor-status{height:37px;display:flex;align-items:center;gap:10px;padding:0 13px;background:#0c0a11;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}.saved{color:var(--mint)}.status-spacer{flex:1}.status-button{border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:rgba(255,255,255,.04);color:var(--secondary);font:10.5px inherit;cursor:pointer}.status-button.primary{border:0;background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:white;font-weight:700}
  </style>
</head>
<body>
  <div class="traffic"><i></i><i></i><i></i></div><div class="topbar"><button class="shell-button" title="切换侧栏">☰</button></div>
  <div class="window">
    <aside class="sidebar"><div class="brand"><div class="appicon">♫</div><div><strong>LyricsMTMR</strong><small>Touch Bar, your way</small></div></div><label class="search">⌕ <input id="search" placeholder="搜索设置" /></label><nav class="nav" id="nav"></nav><div class="footer"><span>v2.5</span><span>设置审阅版</span></div></aside>
    <main><div class="content" id="content"></div></main>
  </div>
  <div class="review"><b>审阅提示</b>：开启浏览器“批注模式”后，直接框选元素并写下期望即可。</div>
  <script>
    const groups=[['常用设置',[['general','⚙','通用','启动、交互与语言'],['lyrics','♫','歌词','Touch Bar 歌词的外观与行为'],['slots','▣','槽位','一键切换整套 Touch Bar 配置'],['editor','☷','编辑器','可视化调整 Touch Bar 元素'],['keyBindings','⌨','键位','可视化编辑快捷键绑定'],['services','⌁','服务','集中管理第三方 API 密钥']]],['小组件',[['stock','⌁','股票','A 股行情与图表'],['pomodoro','◷','番茄钟','工作/休息时长'],['weather','☀','天气','城市、单位与显示'],['rss','◌','RSS','订阅源、获取方式与未读角标'],['package','□','快递','快递单号与刷新'],['calendar','▦','日历','日历源与日程范围'],['homekit','⌂','智能家居','米家场景与设备'],['ai','✦','AI 助手','模型与 Prompt 模板']]],['更多设置',[['expense','¥','记账','类别、预算与目标'],['dock','▤','Dock','固定应用与图标'],['notification','♢','通知','通知中心与系统通知过滤'],['systemMonitor','◫','系统监控','CPU/网络刷新率'],['wellness','♡','健康','久坐、阅读与呼吸'],['lifestyle','◒','生活','外卖、穿衣与宠物'],['tools','⚒','快捷工具','剪贴板、哈希与窗口']]],['',[['about','ⓘ','关于','项目构造说明与致谢']]]];
    let selected='general'; const nav=document.querySelector('#nav'), content=document.querySelector('#content');
    function renderNav(query=''){nav.innerHTML='';groups.forEach(([name,tabs])=>{const visible=tabs.filter(t=>t[2].includes(query)||t[3].includes(query));if(!visible.length)return;if(name){const l=document.createElement('div');l.className='group';l.textContent=name;nav.append(l)}visible.forEach(t=>{const b=document.createElement('button');b.className=t[0]===selected?'active':'';b.innerHTML=`<span class="icon">${t[1]}</span>${t[2]}`;b.onclick=()=>{selected=t[0];renderNav(query);renderContent(t)};nav.append(b)})})}
    function toggle(on=false){return `<button class="toggle ${on?'on':''}" aria-label="切换"></button>`}
    function row(title,sub,on=false){return `<div class="row"><div class="row-copy"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div>${toggle(on)}</div>`}
    function general(){return `<div class="heading"><h1>通用</h1><p>启动、交互与语言</p></div><section class="section"><div class="label">启动</div><div class="card">${row('开机自启','登录 macOS 时自动启动')}<div class="divider"></div>${row('Touch Bar 镜像窗口','在屏幕上预览 Touch Bar 内容',true)}</div></section><section class="section"><div class="label">交互</div><div class="card">${row('触觉反馈','点按 Touch Bar 时轻微震动',true)}<div class="divider"></div>${row('音量 / 亮度滑动手势','在 Touch Bar 上滑动调节音量与亮度',true)}<div class="divider"></div>${row('隐藏 Control Strip','关闭系统右侧的快捷控制区')}<div class="divider"></div>${row('切换应用时冻结','切换应用时暂时保持当前 Touch Bar',true)}</div></section><section class="section"><div class="label">语言</div><div class="card"><div class="setting"><div class="split"><span class="setting-title">界面语言</span><div class="segments"><button class="selected">系统</button><button>English</button><button>中文</button></div></div><div class="notice">更改语言后需要重启应用才能完全生效</div></div></div></section><section class="section"><div class="label">黑名单 <span class="hint">黑名单中的应用会保留系统原生 Touch Bar</span></div><div class="card"><div class="empty"><b>还没有黑名单应用</b>在编辑器中选择应用后，可将其加入黑名单。</div></div></section>`}
    function editor(){return `<div class="editor-view"><div class="editor-ribbon"><div class="r-group" data-label="主题"><span class="theme-dot">♣</span><div><div class="selectlike">items.json　⌄</div><div class="tiny">● 已修改</div></div><button class="r-action"><b>•••</b></button></div><div class="r-group" data-label="草稿"><div class="selectlike">草稿　⌄</div><button class="status-button">◉ 实时</button></div><div class="r-group" data-label="剪贴"><button class="r-action"><b>✂</b>剪切<kbd>⌘X</kbd></button><button class="r-action"><b>▣</b>复制<kbd>⌘C</kbd></button><button class="r-action"><b>▤</b>粘贴<kbd>⌘V</kbd></button></div><div class="r-group" data-label="编辑"><button class="r-action"><b>↶</b>撤销<kbd>⌘Z</kbd></button><button class="r-action"><b>↷</b>重做<kbd>⇧⌘Z</kbd></button><button class="r-action"><b>⌫</b>删除<kbd>⌫</kbd></button></div><div class="r-group" data-label="模式"><button class="r-action"><b>✎</b>编辑</button><button class="r-action"><b>◉</b>预览</button></div></div><div class="editor-palette"><div class="palette-search"><button class="shell-button" id="palette-toggle">▦</button><span>⌕</span><input id="element-search" placeholder="搜索组件…" /></div><div class="chips" id="chips"><button class="chip"><b>♫</b>歌词</button><button class="chip selected" data-select="music"><b>▶</b>音乐</button><button class="chip"><b>◷</b>时钟</button><button class="chip"><b>☀</b>天气</button><button class="chip"><b>▥</b>股票</button><button class="chip"><b>⌁</b>音量</button><button class="chip"><b>⌘</b>快捷键</button><button class="chip"><b>□</b>群组</button></div></div><div class="simulator"><div class="sim-label">Touch Bar 模拟器 · 拖动分区手柄调整布局</div><div class="touchbar"><div class="zone"><span class="bar-pill mini">⎋</span><span class="bar-pill">☀ 26°</span></div><div class="handle"></div><div class="zone center"><span class="bar-pill">◀</span><span class="bar-pill selected" id="music-pill">▶ Music</span><span class="bar-pill">▶</span><span class="bar-pill">⏯</span></div><div class="handle"></div><div class="zone"><span class="bar-pill">⌁</span><span class="bar-pill mini">☀</span></div></div></div><div class="inspector"><div class="empty-inspector"><div class="hand">☝</div><p>选择一个 Touch Bar 元素以编辑属性</p><small>⌘+点击 多选 · ⇧+点击 连选 · 双击容器进入子项</small></div><aside class="properties" id="properties"><div class="prop-title"><span>▶</span><div>音乐 <small style="display:block;color:var(--muted);font-weight:400;margin-top:2px">music</small></div></div><div class="prop-section"><h3>基本</h3><div class="prop-row">标题 <input class="field" value="Music" /></div><div class="prop-row">对齐 <div class="segments"><button>左</button><button class="selected">中</button><button>右</button></div></div><div class="prop-row">显示图标 ${toggle(true)}</div></div><div class="prop-section"><h3>外观</h3><div class="prop-row">文字颜色 <button class="color-dot" aria-label="文字颜色"></button></div><div class="prop-row">字体大小 <input class="field" value="13 pt" /></div><div class="prop-row">紧凑显示 ${toggle()}</div></div><div class="prop-section"><h3>动作</h3><div class="prop-row">点按动作 <button class="field">播放 / 暂停　⌄</button></div><div class="prop-row">长按菜单 ${toggle(true)}</div></div></aside></div><div class="editor-status"><span class="saved">● 已保存</span><span>编辑中:</span><b style="color:var(--text);font-family:ui-monospace">items.json</b><span class="status-spacer"></span><button class="status-button">◉ 实时</button><button class="status-button">↗ 另存</button><button class="status-button primary">⇩ 保存</button></div></div>`}
    function generic(tab){return `<div class="heading"><h1>${tab[2]}</h1><p>${tab[3]}</p></div><div class="placeholder"><div class="label">${tab[2]}设置</div><div class="card"><div class="setting"><div class="setting-title">此标签页的审阅入口已就绪</div><p>请先批注编辑器或通用页；其他页会按同样方式补齐真实布局。</p></div></div></div>`}
    function renderContent(tab){tab=tab||groups[0][1][0];content.innerHTML=tab[0]==='general'?general():tab[0]==='editor'?editor():generic(tab);document.querySelectorAll('.toggle').forEach(x=>x.onclick=()=>x.classList.toggle('on'));document.querySelectorAll('.segments button').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('button').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});const p=document.querySelector('#palette-toggle');if(p)p.onclick=()=>document.querySelector('#chips').classList.toggle('show')}renderNav();renderContent();document.querySelector('#search').oninput=e=>renderNav(e.target.value.trim());
  </script>
</body>
</html>
